format:
  name: spark-project
  version: 1

app:
  name: example

midi:
  device: loopIN_1A
  mode: open-existing

dmx:
  device: COM3
  backend: open
  refresh-rate-hz: 44

fixtures:
  - id: par
    name: Stairville PAR
    start-address: 1
    template: "stairville:par"

scenes:
  - id: red-wash
    name: Red Wash
    type: static
    trigger:
      channel: 1
      note: 60
      mode: gate
    values:
      par.dimmer: 255
      par.red: 255
      par.green: 0
      par.blue: 0
  - id: color-cycle
    name: Color Cycle
    type: sequence
    trigger:
      channel: 1
      note: 61
      mode: gate
    loop: true
    steps:
      - duration-ms: 1000
        transition: linear
        values:
          par.dimmer: 255
          par.red: 255
          par.green: 0
          par.blue: 0
      - duration-ms: 1000
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 255
          par.blue: 0
      - duration-ms: 1000
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 0
          par.blue: 255
  - id: white-strobe
    name: White Strobe
    type: static
    trigger:
      channel: 1
      note: 62
      mode: gate
    values:
      par.dimmer: 255
      par.red: 0
      par.green: 0
      par.blue: 0
      par.white: 255
      par.strobe: 255
  - id: epileptic-cycle
    name: Epileptic Cycle
    type: sequence
    trigger:
      channel: 1
      note: 63
      mode: gate
    loop: true
    steps:
      - duration-ms: 250
        transition: linear
        values:
          par.dimmer: 255
          par.red: 255
          par.green: 0
          par.blue: 0
          par.strobe: 255
      - duration-ms: 250
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 255
          par.blue: 0
          par.strobe: 255
      - duration-ms: 250
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 0
          par.blue: 255
          par.strobe: 255

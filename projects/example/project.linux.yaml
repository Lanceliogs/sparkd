format:
  name: spark-project
  version: 1

app:
  name: example

midi:
  device: spark_midi_in
  mode: create-virtual

dmx:
  device: /dev/ttyUSB0
  backend: open
  refresh-rate-hz: 25

fixtures:
  - id: par
    name: Stairville PAR
    start-address: 1
    template: "stairville:par"
  - id: test
    name: Test
    start-address: 10
    template: "stairville:switch-4ch"
  - id: test-2
    name: Test 2
    start-address: 15
    channel-count: 4
    channels:
      - name: ch1
        offset: 0
      - name: ch2
        offset: 1
      - name: ch3
        offset: 2
      - name: ch4
        offset: 3
  - id: test-1
    name: Test 1
    start-address: 20
    channel-count: 4
    channels:
      - name: ch1
        offset: 0
      - name: ch2
        offset: 1
      - name: ch3
        offset: 2
      - name: ch4
        offset: 3

scenes:
  - id: red-wash
    name: Red Wash
    type: static
    trigger:
      channel: 1
      note: 60
      mode: gate
    values:
      par.dimmer: 255
      par.red: 255
      par.green: 0
      par.blue: 0
      par.mode: 0
      par.white: 0
      par.color: 0
      par.strobe: 0
  - id: color-cycle
    name: Color Cycle
    type: sequence
    trigger:
      channel: 1
      note: 61
      mode: gate
    loop: true
    steps:
      - duration-ms: 1000
        transition: linear
        values:
          par.dimmer: 255
          par.red: 255
          par.green: 0
          par.blue: 0
      - duration-ms: 1000
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 255
          par.blue: 0
      - duration-ms: 1000
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 0
          par.blue: 255
  - id: white-strobe
    name: White Strobe
    type: static
    trigger:
      channel: 1
      note: 62
      mode: gate
    values:
      par.dimmer: 255
      par.red: 0
      par.green: 0
      par.blue: 0
      par.white: 255
      par.strobe: 255
  - id: epileptic-cycle
    name: Epileptic Cycle
    type: sequence
    trigger:
      channel: 1
      note: 63
      mode: gate
    loop: true
    steps:
      - duration-ms: 250
        transition: linear
        values:
          par.dimmer: 255
          par.red: 255
          par.green: 0
          par.blue: 0
          par.strobe: 255
      - duration-ms: 250
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 255
          par.blue: 0
          par.strobe: 255
      - duration-ms: 250
        transition: linear
        values:
          par.dimmer: 255
          par.red: 0
          par.green: 0
          par.blue: 255
          par.strobe: 255

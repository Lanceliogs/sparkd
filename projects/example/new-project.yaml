format:
  name: spark-project
  version: 1

midi:
  device: loopIN_1A
  mode: open-existing

dmx:
  device: auto
  backend: open
  refresh-rate-hz: 25

fixtures:
  - id: par
    name: Stairville PAR
    start-address: 1
    template: "stairville:par"

scenes:
  - id: green-wash
    name: Green Wash
    type: static
    trigger:
      channel: 1
      note: 50
      mode: gate
    values:
      par.dimmer: 255
      par.red: 0
      par.blue: 0
      par.green: 255
      par.white: 0
      par.strobe: 0
